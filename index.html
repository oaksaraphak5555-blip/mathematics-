<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#101711">
  <title>LAST LIGHT: คืนสุดท้ายของมนุษย์</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- HUD ด้านบนสุด -->
  <header class="top-hud">
    <div>
      <span class="chip" id="zone">📍 ชานเมือง</span>
      <span class="chip" id="day">🌘 1 · 21:17</span>
    </div>
    <div class="top-btns">
      <button id="bagBtn" class="bag-btn">🎒 กระเป๋า</button>
      <button id="saveTop">💾</button>
    </div>
  </header>

  <!-- หน้าจอเกมหลักเต็มจอ -->
  <div class="game-container">
    <canvas id="game" width="800" height="500" aria-label="แผนที่เกม"></canvas>
    
    <!-- แถบสถานะด่วนบนจอ -->
    <div class="quick-status">
      <span class="chip red-text">❤️ <b id="hp">100</b></span>
      <span class="chip">🧠 <b id="sanity">86</b></span>
      <span class="chip">🍖 <b id="food">2</b></span>
      <span class="chip">🔫 <b id="ammo">3</b></span>
      <span class="chip" id="noise">🔉 เสียง: ต่ำ</span>
    </div>
  </div>

  <!-- ปุ่มควบคุมเสมือนจริงลอยด้านล่าง (Virtual Controls) -->
  <div class="bottom-controls">
    <div class="dpad" aria-label="ปุ่มเดิน">
      <button class="up" data-move="0,-1">▲</button>
      <button class="left" data-move="-1,0">◀</button>
      <button class="down" data-move="0,1">▼</button>
      <button class="right" data-move="1,0">▶</button>
    </div>
    <div class="action-buttons">
      <button id="interact" class="primary">E · สำรวจ</button>
      <button id="attack" class="danger">💥 โจมตี</button>
      <button id="sneak">🤫 ย่อง</button>
      <button id="useFood">🍖 กิน</button>
    </div>
  </div>

  <!-- หน้าต่างป๊อปอัปเมนูกระเป๋า / สเตตัส / ภารกิจ -->
  <dialog id="bagDlg" class="bag-dialog">
    <div class="bag-header">
      <h2>🎒 เมนู & กระเป๋าผู้รอดชีวิต</h2>
      <button id="bagClose" class="close-btn">✕</button>
    </div>
    <div class="bag-body">
      <h3>ภารกิจหลัก</h3>
      <div class="quest">
        <strong id="questName">เสียงจากชั้นใต้ดิน</strong>
        <div id="questText" class="small muted">หาแบตเตอรี่ให้วิทยุฉุกเฉิน</div>
      </div>

      <h3>กระเป๋าไอเทม</h3>
      <div class="inventory" id="inventory"></div>

      <h3>คนที่คุณรู้จัก</h3>
      <div class="small muted" id="people">ลิน — น้องสาว<br>มาร์ค — รปภ.</div>

      <h3>เบาะแสสำคัญ</h3>
      <div class="small muted" id="clues">• ข้อความจากลิน</div>

      <h3>เหตุการณ์ล่าสุด</h3>
      <div class="feed" id="feed">[21:17] ฟื้นขึ้นมาท่ามกลางความมืด</div>

      <div class="actions" style="margin-top: 14px;">
        <button id="loadBtn">📥 โหลดเกม</button>
        <button id="restart" class="danger">🔄 เริ่มใหม่</button>
      </div>
    </div>
  </dialog>

  <!-- ไดอะล็อกเนื้อเรื่อง / เหตุการณ์เกม -->
  <dialog id="dlg">
    <h2 id="dlgTitle"></h2>
    <div id="dlgBody" class="small" style="white-space:pre-line;line-height:1.6"></div>
    <div id="dlgOptions" class="options"></div>
    <div class="actions">
      <button id="dlgClose">ปิด</button>
    </div>
  </dialog>

  <script src="game.js?v=7"></script>
</body>
</html>
